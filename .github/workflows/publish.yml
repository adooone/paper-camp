name: Publish

on:
  release:
    types: [published]

# Trusted publishing: npm trusts this repository's publish.yml through OIDC, so the
# job mints its own short-lived credential and no npm token can expire on us again.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      PAPER_CAMP_UPDATE_TOKEN: ${{ secrets.PAPER_CAMP_UPDATE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Smoke test the packed tarball
        run: pnpm run smoke

      # Trusted publishing needs npm 11.5+; Node 22 bundles npm 10. No registry-url on
      # setup-node either: its placeholder auth token would be sent instead of the OIDC exchange.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Read published version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The daemon publishes only this path through Tailscale Funnel on 8443:
      #   tailscale funnel --bg --https=8443 --set-path /api/machine/update http://localhost:4333/api/machine/update
      # Skipped, not failed, until the token secret exists: an unset secret is an
      # unconfigured hook, and the release itself has already shipped.
      # npm accepts a publish before it serves it ("may take a few minutes"), and the
      # daemon gets one shot: hooked too early, its install fails with ETARGET.
      - name: Wait for the registry
        if: ${{ env.PAPER_CAMP_UPDATE_TOKEN != '' }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            if [ "$(npm view "@dendelion/paper-camp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm did not serve $VERSION within 10 minutes"
          exit 1

      # Fails the step (not the job: the release has shipped) when the daemon reports a
      # failed install, so a green step means the daemon actually took the version.
      - name: Hook the daemon
        if: ${{ env.PAPER_CAMP_UPDATE_TOKEN != '' }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST "https://deimos.pitta-ray.ts.net:8443/api/machine/update" \
            -H "Authorization: Bearer $PAPER_CAMP_UPDATE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"$VERSION\"}")
          echo "$response"
          outcome=$(node -p 'JSON.parse(process.argv[1]).outcome' "$response")
          if [ "$outcome" = "failed" ]; then
            echo "::error::the daemon could not install $VERSION"
            exit 1
          fi
