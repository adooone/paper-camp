name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Smoke test the packed tarball
        run: pnpm run smoke

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Read published version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The daemon publishes only this path through Tailscale Funnel on 8443:
      #   tailscale funnel --bg --https=8443 --set-path /api/machine/update http://localhost:4333/api/machine/update
      - name: Hook the daemon
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            -X POST "https://deimos.pitta-ray.ts.net:8443/api/machine/update" \
            -H "Authorization: Bearer ${{ secrets.PAPER_CAMP_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ steps.version.outputs.version }}\"}"
