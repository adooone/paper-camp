    <title>Paper Camp</title>
    <style>
      #boot-indicator {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #fdfcf8;
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      #boot-indicator svg {
        overflow: visible;
      }
      #boot-indicator .boot-track {
        stroke: #68635c;
        stroke-width: 3.4;
        opacity: 0.15;
      }
      #boot-indicator .boot-head {
        stroke: #68635c;
        stroke-width: 4.6;
        stroke-dasharray: 26 74;
        animation: boot-spin 1.1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          stroke-dashoffset: -100;
        }
      }
      #boot-indicator p {
        margin: 0;
        font-size: 1.125rem;
        color: #68635c;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-indicator .boot-head {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
